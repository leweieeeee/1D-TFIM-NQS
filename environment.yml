# Reproduces the netket-lr conda env used for preliminary VMC.
# CPU install (default).
name: netket-lr
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - jax==0.10.2
      - jaxlib==0.10.2
      - netket==3.22.3
      - nqxpack==0.1.16
      - flax==0.12.7
      - einops==0.8.2
      - matplotlib==3.11.0
      - numpy==2.4.6
      - scipy==1.17.1
      - optax==0.2.8
      - jaxtyping==0.3.10
